<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ee">
  <meta name="description" content="Un jeu de déduction de couleurs, jouable hors ligne.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Code secret">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Code secret — jeu de couleurs</title>
  <style>
    :root { color-scheme: light; --paper:#f5f3ee; --ink:#202522; --muted:#777e78; --line:#d9ded7; --green:#2f7055; --coral:#d96850; --card:#fffefa; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px 16px; background:var(--paper); color:var(--ink); font-family:ui-rounded,"Segoe UI",system-ui,sans-serif; }
    main { width:min(100%,560px); }
    header { text-align:center; margin-bottom:22px; }
    .eyebrow { margin:0 0 8px; color:var(--green); font-size:11px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin:0; font:500 clamp(38px,10vw,52px)/1 Georgia,"Times New Roman",serif; letter-spacing:-.05em; }
    .subtitle { margin:10px 0 0; color:var(--muted); font-size:14px; }
    .card { padding:clamp(18px,5vw,28px); border:1px solid #e8e8e0; border-radius:22px; background:var(--card); box-shadow:0 18px 50px #27382d0d; }
    .status { min-height:28px; margin-bottom:16px; text-align:center; font-weight:750; }
    .status[data-state="won"] { color:var(--green); } .status[data-state="lost"] { color:var(--coral); }
    .slots { display:flex; justify-content:center; gap:12px; margin:18px 0; }
    .slot { width:48px; height:48px; border:2px dashed #cbd1c8; border-radius:50%; background:#f8f8f4; }
    .palette { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; }
    button { font:inherit; }
    .color-button { min-height:45px; display:flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); border-radius:12px; background:white; color:var(--ink); font-weight:650; cursor:pointer; }
    .color-button:hover:not(:disabled) { border-color:#aab8aa; background:#fbfcf8; }
    .color-button:disabled { opacity:.55; cursor:not-allowed; }
    .swatch,.peg { width:20px; height:20px; flex:none; border-radius:50%; border:1px solid #20252222; }
    .red { background:#db5550; } .blue { background:#5485d8; } .green { background:#51a66d; } .yellow { background:#efc94c; } .orange { background:#e8893d; } .purple { background:#9365c6; }
    .actions { display:flex; justify-content:center; gap:10px; margin-top:14px; }
    .action { min-height:43px; padding:0 17px; border:0; border-radius:999px; background:var(--green); color:white; font-weight:750; cursor:pointer; }
    .action.secondary { background:#e9eee8; color:var(--ink); }
    button:focus-visible { outline:3px solid #78a88a; outline-offset:3px; }
    .action:disabled { opacity:.5; cursor:not-allowed; }
    .error { min-height:20px; margin:12px 0 0; color:#a33f32; text-align:center; font-size:13px; }
    .history { margin-top:22px; }
    .history h2 { margin:0 0 10px; font-size:14px; }
    #history-list { display:grid; gap:8px; margin:0; padding:0; list-style:none; }
    .attempt { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 11px; border:1px solid #eceee8; border-radius:12px; background:#fff; }
    .guess-colors { display:flex; gap:6px; }
    .peg { width:22px; height:22px; }
    .feedback { color:var(--muted); font-size:13px; text-align:right; }
    .help { margin:16px 0 0; color:var(--muted); text-align:center; font-size:12px; }
    @media (max-width:380px) { .color-button { font-size:13px; gap:5px; } .swatch { width:16px; height:16px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Déduction · 10 essais</p>
      <h1>Code secret</h1>
      <p class="subtitle">Devinez les quatre couleurs, dans le bon ordre.</p>
    </header>
    <section class="card" aria-label="Jeu du code secret">
      <p class="status" id="status" role="status" aria-live="polite">Appuyez sur « Nouvelle partie » pour commencer.</p>
      <div class="slots" id="slots" aria-label="Votre proposition, quatre couleurs"></div>
      <div class="palette" id="palette" aria-label="Couleurs disponibles"></div>
      <div class="actions">
        <button class="action" id="submit" type="button" disabled>Valider la proposition</button>
        <button class="action secondary" id="undo" type="button" disabled>Effacer une couleur</button>
      </div>
      <p class="error" id="error" role="status" aria-live="polite"></p>
      <section class="history" aria-label="Historique des propositions">
        <h2>Propositions <span id="attempt-count">0</span>/10</h2>
        <ol id="history-list"></ol>
      </section>
      <div class="actions"><button class="action secondary" id="new-game" type="button">Nouvelle partie</button>
        <button class="action secondary" id="install-app" type="button" hidden>Installer l’application</button></div>
    </section>
    <p class="help">Les répétitions sont permises. Bien placées = bonne couleur au bon endroit.</p>
  </main>
  <script>
    (() => {
      "use strict";
      const colors = ["rouge", "bleu", "vert", "jaune", "orange", "violet"];
      const colorClass = { rouge:"red", bleu:"blue", vert:"green", jaune:"yellow", orange:"orange", violet:"purple" };
      const winningLength = 4;
      const maxAttempts = 10;
      const rulesVersion = "code-couleurs-1.0";
      const statusElement = document.getElementById("status");
      const slotsElement = document.getElementById("slots");
      const paletteElement = document.getElementById("palette");
      const errorElement = document.getElementById("error");
      const historyElement = document.getElementById("history-list");
      const countElement = document.getElementById("attempt-count");
      const submitButton = document.getElementById("submit");
      const undoButton = document.getElementById("undo");
      let secret = null;
      let selection = [];
      let game = {
        status: "not-started", attempts: 0, history: [],
        lastGuess: null, lastResult: null, lastError: null
      };

      function copyGuess(guess) { return guess === null ? null : guess.slice(); }
      function copyResult(result) { return result === null ? null : { wellPlaced:result.wellPlaced, misplaced:result.misplaced }; }
      function cloneState() {
        return {
          status:game.status, attempts:game.attempts,
          history:game.history.map(entry => ({ guess:entry.guess.slice(), result:copyResult(entry.result) })),
          lastGuess:copyGuess(game.lastGuess), lastResult:copyResult(game.lastResult),
          lastError:game.lastError === null ? null : { code:game.lastError.code, message:game.lastError.message }
        };
      }
      function fail(code, message) {
        return { code:code, message:message };
      }
      function showError(error) {
        errorElement.textContent = error ? error.message : "";
      }
      function render() {
        const labels = {
          "not-started":"Appuyez sur « Nouvelle partie » pour commencer.",
          "playing":"À vous de proposer le code · essai " + (game.attempts + 1) + " sur " + maxAttempts,
          "won":"Bravo, vous avez trouvé le code secret !",
          "lost":"La partie est terminée. Lancez une nouvelle partie pour rejouer."
        };
        statusElement.textContent = labels[game.status];
        statusElement.dataset.state = game.status;
        countElement.textContent = String(game.attempts);
        slotsElement.replaceChildren();
        for (let i = 0; i < winningLength; i++) {
          const slot = document.createElement("span");
          slot.className = "slot" + (selection[i] ? " " + colorClass[selection[i]] : "");
          slot.setAttribute("aria-label", selection[i] || ("Position " + (i + 1) + " vide"));
          slotsElement.append(slot);
        }
        const playing = game.status === "playing";
        paletteElement.replaceChildren();
        for (const color of colors) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "color-button";
          button.disabled = !playing || selection.length >= winningLength;
          button.setAttribute("aria-label", "Ajouter " + color);
          const swatch = document.createElement("span");
          swatch.className = "swatch " + colorClass[color];
          swatch.setAttribute("aria-hidden", "true");
          const label = document.createElement("span");
          label.textContent = color;
          button.append(swatch, label);
          button.addEventListener("click", () => {
            if (game.status !== "playing" || selection.length >= winningLength) return;
            selection.push(color);
            showError(null);
            render();
          });
          paletteElement.append(button);
        }
        submitButton.disabled = !playing || selection.length !== winningLength;
        undoButton.disabled = !playing || selection.length === 0;
        historyElement.replaceChildren();
        for (const entry of game.history) {
          const row = document.createElement("li");
          row.className = "attempt";
          const guess = document.createElement("span");
          guess.className = "guess-colors";
          guess.setAttribute("aria-label", "Proposition : " + entry.guess.join(", "));
          for (const color of entry.guess) {
            const peg = document.createElement("span");
            peg.className = "peg " + colorClass[color];
            peg.setAttribute("aria-label", color);
            guess.append(peg);
          }
          const feedback = document.createElement("span");
          feedback.className = "feedback";
          feedback.textContent = entry.result.wellPlaced + " bien placée(s) · " + entry.result.misplaced + " mal placée(s)";
          row.append(guess, feedback);
          historyElement.append(row);
        }
      }
      function makeError(code) {
        const messages = {
          "game-not-started":"Aucune partie n’a encore été démarrée.",
          "game-finished":"La partie est déjà terminée.",
          "invalid-type":"La proposition doit être un tableau dense de chaînes.",
          "invalid-length":"Une proposition doit contenir exactement quatre couleurs.",
          "invalid-color":"La couleur proposée n’est pas autorisée."
        };
        return fail(code, messages[code] || "La demande n’est pas valide.");
      }
      function validateColorArray(value) {
        if (!Array.isArray(value)) return "invalid-type";
        for (let i = 0; i < value.length; i++) {
          if (!(i in value) || typeof value[i] !== "string") return "invalid-type";
        }
        if (value.length !== winningLength) return "invalid-length";
        if (value.some(color => !colors.includes(color))) return "invalid-color";
        return null;
      }
      function calculateResult(guess) {
        let wellPlaced = 0;
        const remainingSecret = Object.create(null);
        const remainingGuess = Object.create(null);
        for (let i = 0; i < winningLength; i++) {
          if (guess[i] === secret[i]) {
            wellPlaced++;
          } else {
            remainingSecret[secret[i]] = (remainingSecret[secret[i]] || 0) + 1;
            remainingGuess[guess[i]] = (remainingGuess[guess[i]] || 0) + 1;
          }
        }
        let misplaced = 0;
        for (const color of colors) {
          misplaced += Math.min(remainingSecret[color] || 0, remainingGuess[color] || 0);
        }
        return { wellPlaced:wellPlaced, misplaced:misplaced };
      }
      async function startGame(options) {
        if (options !== undefined) {
          const isPlainObject = options !== null && typeof options === "object" && !Array.isArray(options) &&
            (Object.getPrototypeOf(options) === Object.prototype || Object.getPrototypeOf(options) === null);
          if (!isPlainObject || Reflect.ownKeys(options).some(key => key !== "secret")) {
            throw Object.assign(new Error("Les options de démarrage ne sont pas valides."), { code:"invalid-options" });
          }
        }
        let nextSecret;
        if (options !== undefined && Object.prototype.hasOwnProperty.call(options, "secret")) {
          const code = validateColorArray(options.secret);
          if (code) throw Object.assign(new Error(makeError(code).message), { code:code });
          nextSecret = options.secret.slice();
        } else {
          nextSecret = Array.from({ length:winningLength }, () => colors[Math.floor(Math.random() * colors.length)]);
        }
        secret = nextSecret;
        selection = [];
        game = { status:"playing", attempts:0, history:[], lastGuess:null, lastResult:null, lastError:null };
        showError(null);
        render();
        return cloneState();
      }
      async function submitGuess(guess) {
        if (game.status === "not-started") {
          game.lastError = makeError("game-not-started");
          showError(game.lastError);
          return cloneState();
        }
        if (game.status === "won" || game.status === "lost") {
          game.lastError = makeError("game-finished");
          showError(game.lastError);
          return cloneState();
        }
        const validationError = validateColorArray(guess);
        if (validationError) {
          game.lastError = makeError(validationError);
          showError(game.lastError);
          return cloneState();
        }
        const safeGuess = guess.slice();
        const result = calculateResult(safeGuess);
        game.history.push({ guess:safeGuess, result:result });
        game.attempts++;
        game.lastGuess = safeGuess.slice();
        game.lastResult = copyResult(result);
        game.lastError = null;
        selection = [];
        if (result.wellPlaced === winningLength) game.status = "won";
        else if (game.attempts === maxAttempts) game.status = "lost";
        showError(null);
        render();
        return cloneState();
      }
      function getConfig() {
        return {
          apiVersion:"0.2", rulesVersion:rulesVersion, secretLength:winningLength,
          maxAttempts:maxAttempts, allowDuplicates:true, colors:colors.slice()
        };
      }
      function getState() { return cloneState(); }

      submitButton.addEventListener("click", () => { submitGuess(selection.slice()); });
      undoButton.addEventListener("click", () => {
        if (game.status !== "playing") return;
        selection.pop();
        showError(null);
        render();
      });
      document.getElementById("new-game").addEventListener("click", () => { startGame(); });
      const installButton = document.getElementById("install-app");
      let pendingInstallPrompt = null;
      if (window.addEventListener) {
        window.addEventListener("beforeinstallprompt", event => {
          event.preventDefault();
          pendingInstallPrompt = event;
          installButton.hidden = false;
        });
        window.addEventListener("appinstalled", () => {
          pendingInstallPrompt = null;
          installButton.hidden = true;
        });
        if (window.navigator && window.navigator.serviceWorker) {
          window.addEventListener("load", () => {
            window.navigator.serviceWorker.register("./service-worker.js", { scope:"./" }).catch(() => {});
          });
        }
      }
      installButton.addEventListener("click", async () => {
        if (!pendingInstallPrompt) return;
        pendingInstallPrompt.prompt();
        await pendingInstallPrompt.userChoice;
        pendingInstallPrompt = null;
        installButton.hidden = true;
      });
      render();

      const params = new URLSearchParams(window.location.search);
      if (params.get("test") === "1") {
        window.codeSecretTest = Object.freeze({
          version:"0.2", getConfig:getConfig, startGame:startGame,
          submitGuess:submitGuess, getState:getState
        });
      }
    })();
  </script>
</body>
</html>
