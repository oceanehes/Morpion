<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ee">
  <title>Morpion — à vous de jouer</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f3ee;
      --ink: #202522;
      --muted: #777e78;
      --line: #d9ded7;
      --green: #2f7055;
      --green-dark: #245640;
      --coral: #d96850;
      --card: #fffefa;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background: var(--paper);
      color: var(--ink);
      font-family: ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    .game { width: min(100%, 470px); }
    header { text-align: center; margin-bottom: 26px; }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--green);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .19em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(40px, 10vw, 54px);
      font-weight: 500;
      letter-spacing: -.055em;
      line-height: 1;
    }
    .subtitle { margin: 12px 0 0; color: var(--muted); font-size: 14px; }
    .card {
      padding: clamp(20px, 6vw, 30px);
      border: 1px solid #e8e8e0;
      border-radius: 24px;
      background: var(--card);
      box-shadow: 0 18px 50px #27382d0d, 0 2px 8px #27382d08;
    }
    .status {
      min-height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-bottom: 21px;
      font-size: 15px;
      font-weight: 700;
    }
    .status-mark { width: 10px; height: 10px; border-radius: 50%; background: var(--green); }
    .status[data-state="over"] .status-mark { background: var(--coral); }
    .status[data-state="draw"] .status-mark { background: #b48b35; }
    .status strong { color: var(--green); }
    .status[data-state="over"] strong { color: var(--coral); }
    .status[data-state="draw"] strong { color: #987326; }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      aspect-ratio: 1;
      padding: 10px;
      border-radius: 20px;
      background: #eef1eb;
    }
    .cell {
      display: grid;
      place-items: center;
      min-width: 0;
      padding: 0;
      border: 1px solid #e5e8e0;
      border-radius: 13px;
      background: var(--card);
      color: var(--ink);
      font: 700 clamp(52px, 17vw, 78px)/1 ui-rounded, "Segoe UI", system-ui, sans-serif;
      cursor: pointer;
      transition: transform .14s ease, background .14s ease, box-shadow .14s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .cell:not(:disabled):hover { transform: translateY(-2px); background: #fbfcf8; box-shadow: 0 5px 13px #23362912; }
    .cell:not(:disabled):active { transform: scale(.97); }
    .cell:focus-visible, .reset:focus-visible { outline: 3px solid #78a88a; outline-offset: 3px; }
    .cell[data-mark="X"] { color: var(--green); }
    .cell[data-mark="O"] { color: var(--coral); }
    .cell.winner { background: #e1eee5; border-color: #c9ddce; }
    .cell:disabled { cursor: default; }
    .footer { display: flex; justify-content: center; margin-top: 22px; }
    .reset {
      min-height: 46px;
      padding: 0 20px;
      border: 0;
      border-radius: 999px;
      background: var(--green);
      color: white;
      font: 700 14px ui-rounded, "Segoe UI", system-ui, sans-serif;
      cursor: pointer;
      transition: background .15s ease, transform .15s ease;
    }
    .reset:hover { background: var(--green-dark); transform: translateY(-1px); }
    .hint { margin: 16px 0 0; text-align: center; color: #929891; font-size: 12px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="game">
    <header>
      <p class="eyebrow">Un jeu à deux</p>
      <h1>Morpion</h1>
      <p class="subtitle">À vous de jouer, chacun votre tour.</p>
    </header>
    <section class="card" aria-label="Partie de morpion">
      <div class="status" id="status" role="status" aria-live="polite" data-state="playing">
        <span class="status-mark" aria-hidden="true"></span>
        <span id="message"><strong>À X de jouer</strong></span>
      </div>
      <div class="board" id="board" role="group" aria-label="Grille de morpion, trois lignes et trois colonnes">
        <button class="cell" type="button" aria-label="Ligne 1, colonne 1, vide" data-index="0"></button>
        <button class="cell" type="button" aria-label="Ligne 1, colonne 2, vide" data-index="1"></button>
        <button class="cell" type="button" aria-label="Ligne 1, colonne 3, vide" data-index="2"></button>
        <button class="cell" type="button" aria-label="Ligne 2, colonne 1, vide" data-index="3"></button>
        <button class="cell" type="button" aria-label="Ligne 2, colonne 2, vide" data-index="4"></button>
        <button class="cell" type="button" aria-label="Ligne 2, colonne 3, vide" data-index="5"></button>
        <button class="cell" type="button" aria-label="Ligne 3, colonne 1, vide" data-index="6"></button>
        <button class="cell" type="button" aria-label="Ligne 3, colonne 2, vide" data-index="7"></button>
        <button class="cell" type="button" aria-label="Ligne 3, colonne 3, vide" data-index="8"></button>
      </div>
      <div class="footer"><button class="reset" id="reset" type="button">Nouvelle partie</button></div>
    </section>
    <p class="hint">X commence · 3 symboles alignés pour gagner</p>
  </main>
  <script>
    (() => {
      const cells = [...document.querySelectorAll('.cell')];
      const status = document.getElementById('status');
      const message = document.getElementById('message');
      const winningLines = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8],
        [0, 3, 6], [1, 4, 7], [2, 5, 8],
        [0, 4, 8], [2, 4, 6]
      ];
      let board = Array(9).fill('');
      let current = 'X';
      let finished = false;

      function setMessage(html, state) {
        message.innerHTML = html;
        status.dataset.state = state;
      }

      function play(index) {
        if (finished || board[index]) return;
        board[index] = current;
        const cell = cells[index];
        cell.textContent = current;
        cell.dataset.mark = current;
        cell.setAttribute('aria-label', `Ligne ${Math.floor(index / 3) + 1}, colonne ${index % 3 + 1}, ${current}`);

        const line = winningLines.find(([a, b, c]) => board[a] && board[a] === board[b] && board[a] === board[c]);
        if (line) {
          finished = true;
          line.forEach(i => cells[i].classList.add('winner'));
          cells.forEach(button => button.disabled = true);
          setMessage(`<strong>${current} a gagné !</strong>`, 'over');
          return;
        }
        if (board.every(Boolean)) {
          finished = true;
          cells.forEach(button => button.disabled = true);
          setMessage('<strong>Match nul !</strong> La grille est pleine.', 'draw');
          return;
        }
        current = current === 'X' ? 'O' : 'X';
        setMessage(`À <strong>${current} de jouer</strong>`, 'playing');
      }

      function reset() {
        board = Array(9).fill('');
        current = 'X';
        finished = false;
        cells.forEach((cell, index) => {
          cell.textContent = '';
          cell.disabled = false;
          cell.classList.remove('winner');
          delete cell.dataset.mark;
          cell.setAttribute('aria-label', `Ligne ${Math.floor(index / 3) + 1}, colonne ${index % 3 + 1}, vide`);
        });
        setMessage('<strong>À X de jouer</strong>', 'playing');
        cells[0].focus();
      }

      cells.forEach(cell => cell.addEventListener('click', () => play(Number(cell.dataset.index))));
      document.getElementById('reset').addEventListener('click', reset);
    })();
  </script>
</body>
</html>
